name: Deploy to Replicate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    env:
      REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Cog
        run: |
          sudo curl -o /usr/local/bin/cog -L https://github.com/replicate/cog/releases/latest/download/cog_Linux_x86_64
          sudo chmod +x /usr/local/bin/cog
      
      - name: Verify token is set
        run: |
          if [ -z "$REPLICATE_API_TOKEN" ]; then
            echo "ERROR: REPLICATE_API_TOKEN is not set!"
            exit 1
          fi
          echo "Token is set (first 10 chars): ${REPLICATE_API_TOKEN:0:10}..."
      
      - name: Login to Replicate
        run: |
          echo "$REPLICATE_API_TOKEN" | cog login --token-stdin
      
      - name: Push to Replicate
        run: |
          cog push r8.im/dobariyz/facefixer-model
