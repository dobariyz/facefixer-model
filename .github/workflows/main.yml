name: Deploy to Replicate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Cog
        run: |
          sudo curl -o /usr/local/bin/cog -L https://github.com/replicate/cog/releases/latest/download/cog_Linux_x86_64
          sudo chmod +x /usr/local/bin/cog
      
      - name: Push to Replicate (with API token)
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          # Verify token exists
          if [ -z "$REPLICATE_API_TOKEN" ]; then
            echo "❌ ERROR: REPLICATE_API_TOKEN secret is not set!"
            echo "Go to Settings → Secrets → Actions and add your r8_ token"
            exit 1
          fi
          
          echo "✅ API Token detected (first 10 chars): ${REPLICATE_API_TOKEN:0:10}..."
          echo "🚀 Pushing model to Replicate..."
          
          # Push directly with API token (no login needed!)
          cog push r8.im/dobariyz/facefixer-model
